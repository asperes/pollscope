[workspace]
resolver = "3"
members = ["crates/analysis", "crates/capture", "crates/app"]

[workspace.package]
version = "0.1.0-rc.2"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/asperes/pollscope"
publish = false

[workspace.dependencies]
analysis = { path = "crates/analysis" }
capture = { path = "crates/capture" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
csv = "=1.4.0"
sha2 = "=0.11.1"
rtrb = "=0.4.1"
proptest = "=1.12.0"
windows = "=0.62.2"
# Umbrella crate: pins gpui-pre =0.3.11 and re-exports GPUI, gpui-base and gpui-component.
gpui-kit = "=0.9.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
